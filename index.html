<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SVS ERP" />
  <title>Sai Vidyaniketan School ERP</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="assets/logo.jpg" type="image/jpeg" />
  <!-- Hide login instantly if a token exists — prevents mobile PWA refresh flash -->
  <script>
    (function () {
      try {
        if (localStorage.getItem("svs_token") || sessionStorage.getItem("svs_token")) {
          document.documentElement.classList.add("has-session");
        }
      } catch (e) {}
    })();
  </script>
  <style>
    html.has-session #login-view { display: none !important; }
    html.has-session #app-view.hidden { display: flex !important; }
  </style>
</head>
<body>
  <div id="login-view" class="login-page">
    <section class="login-hero" aria-label="Brand">
      <div class="login-hero-inner">
        <img src="assets/logo.jpg" alt="Sai Vidyaniketan School logo" />
        <h1 id="login-school">Sai Vidyaniketan School</h1>
        <p class="motto" id="login-motto">Knowledge is Wisdom</p>
      </div>
    </section>
    <section class="login-side">
      <div class="login-form-wrap">
        <h2>Log in</h2>
        <p class="sub">Enter your school login details</p>
        <form id="login-form">
          <div class="form-row">
            <label for="username">User name</label>
            <input id="username" name="username" autocomplete="username" required value="admin" />
          </div>
          <div class="form-row">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required value="Admin@123" />
          </div>
          <button class="btn btn-block" type="submit">Log in</button>
        </form>
        <p class="hint">
          <span data-demo-badge class="hidden">Demo · admin / Admin@123</span>
          <span data-live-badge>School records are connected</span>
        </p>
        <button type="button" class="btn btn-ghost btn-block install-btn hidden" id="install-btn-login" style="margin-top:0.85rem">Add to home screen</button>
      </div>
    </section>
  </div>

  <div id="app-view" class="app-shell hidden">
    <aside class="sidebar" aria-label="Main">
      <div class="sidebar-brand">
        <img src="assets/logo.jpg" alt="" />
        <div>
          <div class="name" data-school-short>SVS</div>
          <div class="sub">School office</div>
        </div>
      </div>
      <ul class="nav-list" id="sidebar-nav"></ul>
      <div class="sidebar-footer">
        <div data-user-name></div>
        <span class="badge badge-info hidden" data-demo-badge>Demo</span>
        <div class="footer-actions">
          <button type="button" class="install-btn hidden" id="install-btn-side">Add to home screen</button>
          <button type="button" data-logout>Log out</button>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="workspace-bar">
        <img src="assets/logo.jpg" alt="" />
        <strong class="workspace-school" data-school-name>Sai Vidyaniketan School</strong>
        <button type="button" class="install-btn hidden" id="install-btn-top" style="width:auto;margin-left:auto;padding:0.35rem 0.7rem;font-size:0.75rem">Add app</button>
        <span class="workspace-user" data-user-name></span>
      </header>
      <main class="content" id="app-content"></main>
    </div>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile"></nav>
  </div>

  <div class="more-drawer-backdrop" id="more-backdrop" hidden></div>
  <div class="more-drawer" id="more-drawer" role="dialog" aria-label="All menus" hidden>
    <div class="more-drawer-head">
      <h3>All screens</h3>
      <button type="button" id="more-close" aria-label="Close">✕</button>
    </div>
    <div class="more-drawer-body" id="more-drawer-body"></div>
  </div>

  <div id="toasts"></div>

  <script src="config.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/ledger.js"></script>
  <script src="js/core.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/receiptPdf.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
