<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E3A5F" />
  <title>Sai Vidyaniketan School ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="assets/logo.jpg" type="image/jpeg" />
</head>
<body>
  <div id="login-view" class="login-page">
    <div class="login-panel">
      <div class="login-brand">
        <img class="login-logo" src="assets/logo.jpg" alt="Sai Vidyaniketan School logo" />
        <h1 id="login-school">Sai Vidyaniketan School</h1>
        <p class="motto" id="login-motto">Knowledge is Wisdom</p>
      </div>
      <div class="login-form-wrap">
        <form id="login-form">
          <div class="form-row">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required value="admin" />
          </div>
          <div class="form-row">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required value="Admin@123" />
          </div>
          <button class="btn btn-block btn-dark" type="submit">Sign in</button>
        </form>
        <p class="hint">
          <span data-demo-badge class="hidden">Demo mode · admin / Admin@123</span>
          <span data-live-badge>School records via secure Apps Script</span>
        </p>
      </div>
    </div>
  </div>

  <div id="app-view" class="app-shell hidden">
    <aside class="sidebar" aria-label="Main">
      <div class="sidebar-brand">
        <img src="assets/logo.jpg" alt="" />
        <div>
          <div class="name" data-school-short>SVS</div>
          <div class="sub">School ERP</div>
        </div>
      </div>
      <ul class="nav-list" id="sidebar-nav"></ul>
      <div class="sidebar-footer">
        <div data-user-name></div>
        <span class="badge badge-info hidden" data-demo-badge>Demo</span>
        <button type="button" data-logout>Sign out</button>
      </div>
    </aside>

    <div class="main">
      <header class="workspace-bar">
        <img src="assets/logo.jpg" alt="" />
        <strong data-school-short>SVS</strong>
        <span style="margin-left:auto;font-size:0.82rem;opacity:0.9" data-user-name></span>
      </header>
      <main class="content" id="app-content"></main>
    </div>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile"></nav>
  </div>

  <div id="toasts"></div>

  <script src="config.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/ledger.js"></script>
  <script src="js/core.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
